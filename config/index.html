<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WristFrame</title>
<style>
  :root { color-scheme: light dark; --accent: #ff4700; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f2; color: #222;
  }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #eee; } }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .preview {
    display: flex; justify-content: center; align-items: center;
    min-height: 260px; margin: 16px 0;
  }
  canvas#preview {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; max-width: 100%;
  }
  canvas#preview.round { border-radius: 50%; }
  .placeholder { opacity: 0.6; text-align: center; }
  label.picker, button {
    display: block; width: 100%; box-sizing: border-box;
    padding: 14px; margin-top: 12px; border: 0; border-radius: 8px;
    font-size: 17px; text-align: center; cursor: pointer;
  }
  label.picker { background: #ddd; color: #222; }
  @media (prefers-color-scheme: dark) { label.picker { background: #333; color: #eee; } }
  button.save { background: var(--accent); color: #fff; }
  button.save:disabled { opacity: 0.4; }
  button.cancel { background: transparent; color: inherit; }
  button.clear { background: transparent; color: var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot {
    position: relative; aspect-ratio: 200 / 228; padding: 0; margin: 0;
    border: 2px solid transparent; border-radius: 8px; overflow: hidden;
    background: #ddd; color: #666; font-size: 13px;
  }
  @media (prefers-color-scheme: dark) { .slot { background: #333; color: #999; } }
  .slot.round { aspect-ratio: 1; }
  .slot.selected { border-color: var(--accent); }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot.round img { border-radius: 50%; }
  .slot .num {
    position: absolute; left: 4px; top: 4px; min-width: 18px; padding: 1px 4px;
    border-radius: 9px; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 12px;
  }
  .help { margin: 8px 0 0; font-size: 14px; opacity: 0.7; text-align: center; }
  [hidden], input[type=file] { display: none !important; }
  footer { margin-top: 24px; text-align: center; font-size: 14px; opacity: 0.7; }
  footer a { color: inherit; }
</style>
</head>
<body>
<h1>WristFrame</h1>

<div class="slots" id="slots"></div>
<p class="help">Press Up and Down on the watch to switch images.</p>

<div class="preview">
  <p class="placeholder" id="placeholder"></p>
  <canvas id="preview" hidden></canvas>
</div>

<label class="picker">Choose photo<input type="file" id="file" accept="image/*,.heic,.heif"></label>
<button class="save" id="save" disabled>Send to watch</button>
<button class="clear" id="clear" hidden>Clear slot</button>
<button class="cancel" id="cancel">Cancel</button>

<footer>
  <a href="https://github.com/lanrat/WristFrame" target="_blank" rel="noopener">WristFrame on GitHub</a>
</footer>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var WIDTH = parseInt(params.get('width'), 10) || 200;
  var HEIGHT = parseInt(params.get('height'), 10) || 228;
  var ROUND = params.get('round') === '1' ? 1 : 0;
  var RETURN_TO = params.get('return_to') || 'pebblejs://close#';
  var PREVIEW_SCALE = 1;
  var SLOT_COUNT = 4;
  var THUMB_WIDTH = 48;

  var fileInput = document.getElementById('file');
  var saveButton = document.getElementById('save');
  var preview = document.getElementById('preview');
  var placeholder = document.getElementById('placeholder');
  var clearButton = document.getElementById('clear');
  var slotsEl = document.getElementById('slots');
  var packed = null;
  var thumb = null;

  // Slot state passed by the app in the URL hash: {slots: [{filled, thumb}]}.
  var slots = [];
  try {
    slots = JSON.parse(decodeURIComponent(location.hash.slice(1))).slots || [];
  } catch (e) {}
  for (var n = 0; n < SLOT_COUNT; n++) {
    slots[n] = slots[n] || { filled: false, thumb: null };
  }
  var selected = 0;
  for (var m = 0; m < SLOT_COUNT; m++) {
    if (!slots[m].filled) { selected = m; break; }
  }

  // Visible pixel columns [x0, x1) of row y. Must match prv_row_span in
  // src/c/main.c: on round displays keep pixels whose centre lies within the
  // screen radius plus a 1px margin.
  function rowSpan(y) {
    if (!ROUND) return [0, WIDTH];
    var d = Math.min(WIDTH, HEIGHT) + 2;
    var dy = 2 * y + 1 - HEIGHT;
    var lim = d * d - dy * dy;
    if (lim < 0) return [0, 0];
    var x = 0;
    while (x < (WIDTH >> 1) && (2 * x + 1 - WIDTH) * (2 * x + 1 - WIDTH) > lim) x++;
    return [x, WIDTH - x];
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Could not read this photo. Try a JPEG or PNG.'));
      };
      img.src = url;
    });
  }

  // Large camera photos (12 MP and up) take ~50 MB as full-size bitmaps,
  // which can exhaust the memory of the Pebble app's settings WebView. Where
  // supported, shrink to a few times the screen size (all a sharp result
  // needs) as part of decoding. `source` is a Blob or ImageData.
  function shrink(source) {
    var target = Math.max(WIDTH, HEIGHT) * 4;
    function decodeAt(options) {
      options.resizeQuality = 'high';
      options.imageOrientation = 'from-image';
      return createImageBitmap(source, options);
    }
    return decodeAt({ resizeWidth: target }).then(function (bitmap) {
      if (bitmap.height >= target || bitmap.height >= bitmap.width) return bitmap;
      // Wide image: the height limits the crop, so size by height instead.
      bitmap.close();
      return decodeAt({ resizeHeight: target });
    });
  }

  function decodeNative(file) {
    if (!window.createImageBitmap) return loadImage(file);
    return shrink(file).catch(function () {
      return loadImage(file);
    });
  }

  // HEIF (the iPhone camera's default format) only decodes natively in
  // Safari. Elsewhere, decode it with libheif, downloaded only when needed.
  var HEIF_DECODER_URL =
    'https://cdn.jsdelivr.net/npm/libheif-js@1.23.2/libheif-wasm/libheif-bundle.js';
  var HEIF_DECODER_SRI = 'sha384-39BRDvCV5eZ5AgrY3Nr01nkQ/yIWMpfKufwt1PG2rnp3m/0IfzgyMosM0NUb7Pmf';
  var HEIF_BRANDS = ['heic', 'heix', 'heim', 'heis', 'hevc', 'hevx', 'hevm', 'hevs', 'mif1', 'msf1'];
  var heifDecoder = null;

  // HEIF files start with an ISO BMFF 'ftyp' box naming a HEIF brand.
  function isHeif(file) {
    return file.slice(0, 12).arrayBuffer().then(function (buf) {
      var b = new Uint8Array(buf);
      var box = String.fromCharCode.apply(null, b.subarray(4, 8));
      var brand = String.fromCharCode.apply(null, b.subarray(8, 12));
      return box === 'ftyp' && HEIF_BRANDS.indexOf(brand) >= 0;
    }).catch(function () {
      return false;
    });
  }

  function loadHeifDecoder() {
    if (!heifDecoder) {
      heifDecoder = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = HEIF_DECODER_URL;
        script.integrity = HEIF_DECODER_SRI;
        script.crossOrigin = 'anonymous';
        script.onload = function () {
          try {
            resolve(window.libheif());
          } catch (e) {
            reject(e);
          }
        };
        script.onerror = function () {
          heifDecoder = null;
          reject(new Error('Could not download the HEIF decoder. Check your connection and try again.'));
        };
        document.head.appendChild(script);
      });
    }
    return heifDecoder;
  }

  function tooLarge(w, h) {
    return new Error('This photo is too large to convert on this device (' +
      Math.round(w * h / 1e6) + ' MP). Try a smaller copy, such as a screenshot of it.');
  }

  function decodeHeif(file) {
    setStatus('Downloading the HEIF decoder\u2026');
    return Promise.all([loadHeifDecoder(), file.arrayBuffer()]).then(function (r) {
      setStatus('Decoding HEIF photo. Large photos can take up to a minute\u2026');
      // Let the status paint; decoding blocks the page for a few seconds.
      return new Promise(function (resolve) { setTimeout(resolve, 50); }).then(function () {
        var images = new r[0].HeifDecoder().decode(new Uint8Array(r[1]));
        var image = images.filter(function (i) { return i.is_primary(); })[0] || images[0];
        function free() {
          images.forEach(function (i) { i.free(); });
        }
        if (!image) throw new Error('Could not read this HEIF photo.');
        var w = image.get_width(), h = image.get_height();
        var data;
        try {
          data = new ImageData(w, h);
        } catch (e) {
          free();
          throw tooLarge(w, h);
        }
        return new Promise(function (resolve, reject) {
          image.display(data, function (result) {
            free();
            if (result) resolve(data);
            else reject(new Error('Could not decode this HEIF photo.'));
          });
        });
      });
    }).then(function (data) {
      if (window.createImageBitmap) return shrink(data);
      var canvas = document.createElement('canvas');
      canvas.width = data.width;
      canvas.height = data.height;
      canvas.getContext('2d').putImageData(data, 0, 0);
      return canvas;
    });
  }

  function decodeImage(file) {
    return decodeNative(file).catch(function (err) {
      return isHeif(file).then(function (heif) {
        if (!heif) throw err;
        return decodeHeif(file);
      });
    });
  }

  function formatSize(bytes) {
    return bytes >= 1048576
      ? (bytes / 1048576).toFixed(1) + ' MB'
      : Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  // Scale the image to cover WIDTH x HEIGHT and crop the overflow evenly.
  // Downscale in halving steps so large photos stay smooth on every browser.
  function coverCrop(img) {
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    var scale = Math.max(WIDTH / iw, HEIGHT / ih);
    var sw = WIDTH / scale, sh = HEIGHT / scale;
    var sx = (iw - sw) / 2, sy = (ih - sh) / 2;

    var src = img, srcX = sx, srcY = sy, srcW = sw, srcH = sh;
    while (srcW / 2 >= WIDTH && srcH / 2 >= HEIGHT) {
      var step = document.createElement('canvas');
      step.width = Math.round(srcW / 2);
      step.height = Math.round(srcH / 2);
      var sctx = step.getContext('2d');
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = 'high';
      sctx.drawImage(src, srcX, srcY, srcW, srcH, 0, 0, step.width, step.height);
      src = step; srcX = 0; srcY = 0; srcW = step.width; srcH = step.height;
    }

    var out = document.createElement('canvas');
    out.width = WIDTH;
    out.height = HEIGHT;
    var ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, srcX, srcY, srcW, srcH, 0, 0, WIDTH, HEIGHT);
    return ctx.getImageData(0, 0, WIDTH, HEIGHT);
  }

  // Floyd-Steinberg dither to Pebble's 64-colour palette (2 bits per channel).
  // Returns one 6-bit rrggbb value per pixel and updates `image` in place.
  function dither(image) {
    var w = image.width, h = image.height, d = image.data;
    var buf = new Float32Array(w * h * 3);
    for (var i = 0, j = 0; i < d.length; i += 4, j += 3) {
      buf[j] = d[i]; buf[j + 1] = d[i + 1]; buf[j + 2] = d[i + 2];
    }
    var out = new Uint8Array(w * h);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var p = y * w + x, value = 0;
        for (var c = 0; c < 3; c++) {
          var k = p * 3 + c;
          var old = Math.min(255, Math.max(0, buf[k]));
          var level = Math.round(old / 85);
          var err = old - level * 85;
          value = (value << 2) | level;
          d[p * 4 + c] = level * 85;
          if (x + 1 < w) buf[k + 3] += err * 7 / 16;
          if (y + 1 < h) {
            if (x > 0) buf[k + w * 3 - 3] += err * 3 / 16;
            buf[k + w * 3] += err * 5 / 16;
            if (x + 1 < w) buf[k + w * 3 + 3] += err * 1 / 16;
          }
        }
        d[p * 4 + 3] = 255;
        out[p] = value;
      }
    }
    return out;
  }

  // Pack visible pixels at 6 bits each, MSB first.
  function pack(pixels) {
    var bytes = [];
    var acc = 0, bits = 0;
    for (var y = 0; y < HEIGHT; y++) {
      var span = rowSpan(y);
      for (var x = span[0]; x < span[1]; x++) {
        acc = ((acc << 6) | pixels[y * WIDTH + x]) & 0xffff;
        bits += 6;
        if (bits >= 8) {
          bits -= 8;
          bytes.push((acc >> bits) & 0xff);
        }
      }
    }
    if (bits > 0) bytes.push((acc << (8 - bits)) & 0xff);
    return new Uint8Array(bytes);
  }

  // URL-safe base64 (no '+', '/' or '='), so encodeURIComponent leaves it
  // as is and the return URL stays as short as possible.
  function toUrlSafe(b64) {
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromUrlSafe(b64) {
    return b64.replace(/-/g, '+').replace(/_/g, '/');
  }

  function base64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return toUrlSafe(btoa(s));
  }

  function showPreview(image) {
    var avail = Math.max(1, document.body.clientWidth - 32);
    PREVIEW_SCALE = Math.max(1, Math.floor(Math.min(avail / WIDTH, 2)));
    preview.width = WIDTH;
    preview.height = HEIGHT;
    preview.style.width = WIDTH * PREVIEW_SCALE + 'px';
    preview.style.height = HEIGHT * PREVIEW_SCALE + 'px';
    preview.classList.toggle('round', !!ROUND);
    preview.getContext('2d').putImageData(image, 0, 0);
    preview.hidden = false;
    placeholder.hidden = true;
  }

  // Small JPEG of the converted image, shown on the slot tiles next time.
  // Returned as URL-safe base64 without the data: prefix.
  function makeThumb() {
    var c = document.createElement('canvas');
    c.width = THUMB_WIDTH;
    c.height = Math.round(THUMB_WIDTH * HEIGHT / WIDTH);
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(preview, 0, 0, c.width, c.height);
    return toUrlSafe(c.toDataURL('image/jpeg', 0.6).split(',')[1]);
  }

  function render() {
    slotsEl.textContent = '';
    slots.forEach(function (slot, i) {
      var tile = document.createElement('button');
      tile.className = 'slot' + (ROUND ? ' round' : '') + (i === selected ? ' selected' : '');
      tile.setAttribute('aria-label', 'Slot ' + (i + 1));
      if (slot.thumb) {
        var img = document.createElement('img');
        img.src = 'data:image/jpeg;base64,' + fromUrlSafe(slot.thumb);
        img.alt = '';
        tile.appendChild(img);
      } else {
        tile.appendChild(document.createTextNode(slot.filled ? 'Image' : 'Empty'));
      }
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = i + 1;
      tile.appendChild(num);
      tile.addEventListener('click', function () {
        selected = i;
        render();
      });
      slotsEl.appendChild(tile);
    });

    var label = 'slot ' + (selected + 1);
    saveButton.textContent = 'Send to ' + label;
    clearButton.textContent = 'Clear ' + label;
    clearButton.hidden = !slots[selected].filled || !!packed;
    if (!packed) {
      placeholder.textContent = slots[selected].filled
        ? 'Choose a photo to replace ' + label
        : 'Choose a photo for ' + label;
    }
  }

  function setStatus(message) {
    placeholder.hidden = false;
    placeholder.textContent = message;
  }

  function showError(message) {
    packed = null;
    saveButton.disabled = true;
    preview.hidden = true;
    placeholder.hidden = false;
    placeholder.textContent = message;
  }

  window.addEventListener('error', function (e) {
    showError('Something went wrong: ' + (e.message || 'unknown error'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Something went wrong: ' + ((e.reason && e.reason.message) || e.reason));
  });

  // Clear the previous choice so picking the same photo again still fires
  // a change event.
  fileInput.addEventListener('click', function () {
    fileInput.value = '';
  });

  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) {
      showError('No photo was received from the Pebble app. Please try again.');
      return;
    }
    saveButton.disabled = true;
    preview.hidden = true;
    placeholder.hidden = false;
    placeholder.textContent = 'Loading photo (' + formatSize(file.size) + ')\u2026';
    decodeImage(file).then(function (img) {
      placeholder.textContent = 'Converting\u2026';
      var image = coverCrop(img);
      if (img.close) img.close();
      var pixels = dither(image);
      packed = pack(pixels);
      showPreview(image);
      thumb = makeThumb();
      saveButton.disabled = false;
      render();
    }).catch(function (err) {
      showError(err.message || String(err));
    });
  });

  saveButton.addEventListener('click', function () {
    if (!packed) return;
    var result = {
      op: 'set', slot: selected, width: WIDTH, height: HEIGHT, round: ROUND,
      data: base64(packed), thumb: thumb
    };
    location.href = RETURN_TO + encodeURIComponent(JSON.stringify(result));
  });

  clearButton.addEventListener('click', function () {
    var result = { op: 'clear', slot: selected };
    location.href = RETURN_TO + encodeURIComponent(JSON.stringify(result));
  });

  document.getElementById('cancel').addEventListener('click', function () {
    location.href = RETURN_TO;
  });

  render();
})();
</script>
</body>
</html>
