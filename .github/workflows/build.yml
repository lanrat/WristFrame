name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .pbw
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install Pebble tool and SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest

      - name: Build
        run: pebble build

      - uses: actions/upload-artifact@v7
        with:
          name: WristFrame
          path: build/*.pbw
          if-no-files-found: error

  # Releases the version in package.json the first time it reaches the
  # default branch. Pushes that keep the same version release nothing.
  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check for an existing release
        id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v8
        with:
          name: WristFrame
          path: build

      - if: steps.version.outputs.new == 'true'
        name: Add the version to the .pbw filename
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: mv build/WristFrame.pbw "build/WristFrame-$TAG.pbw"

      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WristFrame ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/WristFrame-${{ steps.version.outputs.tag }}.pbw
          fail_on_unmatched_files: true

  pages:
    name: Deploy config page
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: config
      - id: deploy
        uses: actions/deploy-pages@v5
